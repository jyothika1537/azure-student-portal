name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      slot:
        description: 'Target Deployment Slot'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      app_version:
        description: 'Version Tag for Deployment'
        required: true
        default: 'v2.0.0'
        type: string

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME || 'azure-student-portal' }}
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: studentportal-app
          path: '${{ github.workspace }}/target/*.jar'
          retention-days: 2

  deploy:
    name: Deploy to Azure App Service Slot
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.slot || 'staging' }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: studentportal-app
          path: '${{ github.workspace }}/target'

      - name: Deploy to Azure App Service Slot
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ github.event.inputs.slot || 'staging' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '${{ github.workspace }}/target/*.jar'

      - name: Validate Health Probe on Deployment Slot
        run: |
          SLOT="${{ github.event.inputs.slot || 'staging' }}"
          APP="${{ env.AZURE_WEBAPP_NAME }}"
          
          if [ "$SLOT" = "production" ]; then
            HEALTH_URL="https://${APP}.azurewebsites.net/actuator/health"
          else
            HEALTH_URL="https://${APP}-${SLOT}.azurewebsites.net/actuator/health"
          fi
          
          echo "=========================================="
          echo "Azure Slot Swap Warm-up & Health Validation"
          echo "Target Slot: $SLOT"
          echo "Health Probe URL: $HEALTH_URL"
          echo "=========================================="
          
          # Probe health endpoint with retries to account for JVM container warm-up
          SUCCESS=0
          for attempt in {1..8}; do
            echo "Probe Attempt $attempt of 8..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Response HTTP Code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health Check PASSED! The $SLOT slot is warmed up and READY for traffic swap."
              SUCCESS=1
              break
            fi
            sleep 15
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "::warning::Slot health probe did not return 200 within timeout. Please verify App Service logs & DNS."
          fi
