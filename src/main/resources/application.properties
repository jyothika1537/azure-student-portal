# Spring Application Configuration
spring.application.name=studentportal

# Server Port (Azure App Service sets PORT dynamically, defaults to 8080 locally)
server.port=${PORT:8080}

# Actuator Endpoints Configuration for Azure Health Probes & Swap Validation
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Application Metadata & Deployment Slot Settings
# These can be overridden via Azure App Service Application Settings / Slot Settings
app.version=${APP_VERSION:1.0.0}
app.slot-name=${DEPLOYMENT_SLOT:${AZURE_SLOT_NAME:production}}
app.environment=${APP_ENVIRONMENT:Azure Cloud}
